<!doctype html>
<html lang="ru" data-page="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Лосось.кз · открываем приложение</title>
<meta name="apple-itunes-app" content="app-id=6740765547">
<meta name="theme-color" content="#FAF6F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../hub.css">
<style>body{min-height:100vh;display:flex;align-items:center}.w{padding-top:0}</style>
</head>
<body>
<div class="w">
  <img class="logo" src="../img/losos-full-1200.png" alt="Лосось.кз">
  <h1>Открываем приложение…</h1>
  <a class="btn main" data-e="app" id="open" href="https://foodpicasso.com/x/3341xacf">Открыть приложение</a>
  <p class="note">Баллами можно оплатить до половины заказа</p>
</div>
<script src="../track.js"></script>
<script src="../open.js"></script>
<script>
(function () {
  var SCHEME = 'com.foodpicasso.lososkz://';
  var IOS = 'https://apps.apple.com/app/id6740765547';
  var AND = 'https://play.google.com/store/apps/details?id=com.foodpicasso.lososkz';
  var ANY = 'https://foodpicasso.com/x/3341xacf';
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && 'ontouchend' in document);
  var and = /Android/i.test(ua);
  var store = ios ? IOS : (and ? AND : ANY);
  // Кнопка на случай, если встроенный браузер (Instagram, WhatsApp) не дал открыть сам:
  // по нажатию та же логика — приложение, а если его нет, магазин.
  lososOpen(document.getElementById('open'));

  if (and) {
    // Chrome сам откроет приложение, а если его нет — перейдёт на Google Play.
    var intent = 'intent://#Intent;scheme=com.foodpicasso.lososkz;package=com.foodpicasso.lososkz;' +
                 'S.browser_fallback_url=' + encodeURIComponent(AND) + ';end';
    document.getElementById('open').href = intent;
    location.href = intent;
    return;
  }
  if (!ios) { location.href = store; return; }

  // iPhone: пробуем приложение; если страница осталась на экране — значит, его нет.
  var ушли = false;
  function ушёл() { ушли = true; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) ушёл(); });
  window.addEventListener('pagehide', ушёл);
  window.addEventListener('blur', ушёл);
  setTimeout(function () { if (!ушли) location.href = store; }, 1600);
  location.href = SCHEME;
})();
</script>
</body>
</html>
