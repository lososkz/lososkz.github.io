<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лосось — открываем приложение</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#fff3ec;color:#2b2b2b;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;
       text-align:center;padding:16px;box-sizing:border-box}
  .w{max-width:340px;width:100%}
  h1{font-size:20px;font-weight:600;margin:0 0 20px}
  a{display:block;margin:12px 0;padding:15px 18px;border-radius:14px;text-decoration:none;
    font-weight:700;font-size:16px;background:#f26a1b;color:#fff}
  a.s{background:#fff;color:#f26a1b;border:2px solid #f26a1b}
  p{font-size:13px;color:#8a7a70;margin-top:18px}
</style>
</head>
<body>
<div class="w">
  <h1>🍣 Открываем приложение Лосось…</h1>
  <a id="open" href="com.foodpicasso.lososkz://">Открыть приложение</a>
  <a id="store" class="s" href="https://foodpicasso.com/x/3341xacf">Скачать приложение</a>
  <p>Баллами можно оплатить до половины заказа в приложении</p>
</div>
<script>
(function () {
  var SCHEME = 'com.foodpicasso.lososkz://';
  var IOS = 'https://apps.apple.com/app/id6740765547';
  var AND = 'https://play.google.com/store/apps/details?id=com.foodpicasso.lososkz';
  var ANY = 'https://foodpicasso.com/x/3341xacf';
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && 'ontouchend' in document);
  var and = /Android/i.test(ua);
  var store = ios ? IOS : (and ? AND : ANY);
  document.getElementById('store').href = store;

  if (and) {
    // Chrome сам откроет приложение, а если его нет — перейдёт на Google Play.
    var intent = 'intent://#Intent;scheme=com.foodpicasso.lososkz;package=com.foodpicasso.lososkz;' +
                 'S.browser_fallback_url=' + encodeURIComponent(AND) + ';end';
    document.getElementById('open').href = intent;
    location.href = intent;
    return;
  }
  if (!ios) { location.href = store; return; }

  // iPhone: пробуем приложение; если страница осталась на экране — значит, его нет.
  var ушли = false;
  function ушёл() { ушли = true; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) ушёл(); });
  window.addEventListener('pagehide', ушёл);
  window.addEventListener('blur', ушёл);
  setTimeout(function () { if (!ушли) location.href = store; }, 1600);
  location.href = SCHEME;
})();
</script>
</body>
</html>
