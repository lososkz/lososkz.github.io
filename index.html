<script>
  // Слайд акции «10% баллами» прячется сам после 30.09 (Азамат: «вдруг я забуду»).
  if (Date.now() >= Date.parse('2026-10-01T00:00:00+05:00')) {
    var x2s = document.querySelector('[data-e=banner_x2]'); if (x2s) x2s.remove();
    var dd = document.querySelectorAll('#dots i'); if (dd.length > 3) dd[dd.length - 1].remove();
  }
  lososOpen(document.getElementById('open'));
  document.querySelectorAll('.slide').forEach(lososOpen);
  (function(){
    var box=document.getElementById('promo'),dots=document.querySelectorAll('#dots i'),n=dots.length,cur=0,t;
    function mark(i){cur=i;dots.forEach(function(d,k){d.classList.toggle('on',k===i)})}
    box.addEventListener('scroll',function(){mark(Math.round(box.scrollLeft/box.clientWidth))},{passive:true});
    function next(){box.scrollTo({left:((cur+1)%n)*box.clientWidth,behavior:'smooth'})}
    function start(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;clearInterval(t);t=setInterval(next,4500)}
    box.addEventListener('touchstart',function(){clearInterval(t)},{passive:true});
    box.addEventListener('touchend',start,{passive:true});
    start();
  })();
</script>
