<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лосось — доставка суши и роллов</title>

<meta property="og:image" content="https://lososkz.github.io/img/logo.png">
<style>
  :root{--bg:#fff8f2;--brand:#f76707;--ink:#1f1f1f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
       font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:0 16px 40px}
  .w{width:100%;max-width:400px;text-align:center}
  .logo{display:block;width:100%;max-width:400px;margin:0 auto 18px}
  .banner{display:block;width:100%;border-radius:10px;margin:0 0 22px}
  a.btn{display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0;padding:16px 18px;border-radius:14px;
        text-decoration:none;color:#fff;font-weight:800;font-size:17px;text-transform:uppercase;position:relative}
  a.btn .col{display:flex;flex-direction:column;align-items:center}
  a.btn small{font-weight:400;text-transform:none;font-size:14px;opacity:.85;margin-top:3px}
  a.main{background:var(--brand);box-shadow:0 6px 14px rgba(247,103,7,.25);min-height:72px}
  a.site{background:#000}
  a.wa{background:#5c9a0f}
  a.btn .ic{position:absolute;left:18px;font-size:26px}
  a.site,a.wa{padding-left:58px;padding-right:18px;font-size:16px}
  hr{border:0;height:1px;background:linear-gradient(90deg,transparent,#c9c2b8,transparent);width:60%;margin:26px auto}
</style>
</head>
<body>
<div class="w">
  <img class="logo" src="img/logo.png" alt="Лосось">
  <!-- БАННЕР: вернуть, когда проверим, что промокод ПЕРВЫЙ15 жив
  <img class="banner" src="img/banner_pervyi15.jpg" alt="Скидка 15% на первый заказ по промокоду ПЕРВЫЙ15"> -->
  <a class="btn main" id="open" href="https://foodpicasso.com/x/3341xacf">
    <span class="col">Оформить заказ<small>в приложении Лосось</small></span>
  </a>
  <hr>
  <a class="btn site" href="https://losos.kz/?utm_source=hub_main"><span class="ic">🌐</span>Заказать через сайт</a>
  <a class="btn wa" href="https://wa.me/77477142222?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5!!%20%D0%A5%D0%BE%D1%87%D1%83%20%D1%81%D0%B4%D0%B5%D0%BB%D0%B0%D1%82%D1%8C%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7"><span class="ic">💬</span>Заказать через WhatsApp</a>

<script>lososOpen(document.getElementById('open'));</script>
