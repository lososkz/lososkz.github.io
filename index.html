<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Лосось.кз · суши и роллы</title>
<meta name="description" content="Доставка и самовывоз роллов в Костанае и Рудном. Заказывай в приложении, на сайте или в WhatsApp.">
<meta property="og:title" content="Лосось.кз · суши и роллы">
<meta property="og:image" content="https://lososkz.github.io/img/d120.jpg">
<meta name="theme-color" content="#FAF6F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--field:#FAF6F2;--ink:#222;--ink2:#6E6862;--act:#D53610;--act-press:#B92C0B;--salmon:#FF9966;--wa:#1E8E57}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--field)}
  body{margin:0;color:var(--ink);font:500 15px/1.45 Montserrat,-apple-system,system-ui,sans-serif}
  a:focus-visible{outline:3px solid var(--salmon);outline-offset:3px}
  .w{max-width:420px;margin:0 auto;padding:22px 16px 32px;text-align:center}
  .logo{height:34px;display:block;margin:0 auto 6px}
  .city{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 18px}
  .hero{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:20px;background:#222;margin:0 0 18px}
  .btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
       min-height:62px;margin:0 0 12px;padding:12px 56px;border-radius:16px;text-decoration:none;color:#fff;
       font-weight:700;font-size:16.5px;transition:transform .12s,filter .12s}
  .btn:active{transform:scale(.98);filter:brightness(.92)}
  .btn small{font-weight:500;font-size:13px;opacity:.85;margin-top:2px}
  .btn svg{position:absolute;left:20px;top:50%;width:24px;height:24px;margin-top:-12px;
           fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .main{background:var(--act);min-height:74px;font-size:18px;box-shadow:0 10px 22px -10px rgba(120,30,5,.55)}
  .dark{background:#222}
  .wa{background:var(--wa)}
  .light{background:#fff;color:var(--ink);border:1px solid #E6DED6}
  .foot{margin:18px 0 0;font-size:13px;color:var(--ink2)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="w">
  <img class="logo" src="img/losos-full-1200.png" alt="Лосось.кз">
  <p class="city">Доставка роллов · Костанай и Рудный</p>

  <img class="hero" src="img/d120.jpg" alt="Роллы Лосось" fetchpriority="high">

  <a class="btn main" id="open" href="https://foodpicasso.com/x/3341xacf">
    <svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
    Заказать в приложении
    <small>баллы с каждого заказа</small>
  </a>
  <a class="btn dark" href="https://losos.kz/?utm_source=hub_main">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
    Заказать на сайте
  </a>
  <a class="btn wa" href="https://wa.me/77477142222?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5!!%20%D0%A5%D0%BE%D1%87%D1%83%20%D1%81%D0%B4%D0%B5%D0%BB%D0%B0%D1%82%D1%8C%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7">
    <svg viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c.3 2.3 2.2 4.3 4.5 4.8l1.2-1.2 2 .8"/></svg>
    Заказать в WhatsApp
  </a>
  <a class="btn light" href="tel:+77077142222">
    <svg viewBox="0 0 24 24"><path d="M6.5 3.5h3l1.5 4-2 1.3a11 11 0 0 0 6.2 6.2l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2z"/></svg>
    Позвонить
  </a>

  <p class="foot">Гоголя · 5-МКР · КСК · Рудный</p>
</div>
<script src="open.js"></script>
<script>lososOpen(document.getElementById('open'));</script>
</body>
</html>
