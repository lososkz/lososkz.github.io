<!doctype html>

<head>

<style>
  :root{--field:#FAF6F2;--card:#fff;--line:#EDE6DF;--ink:#222;--ink2:#6E6862;--act:#D53610;--act-press:#B92C0B;--salmon:#FF9966}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--field)}
  body{margin:0;color:var(--ink);font:500 15px/1.5 Montserrat,-apple-system,system-ui,sans-serif}
  a{color:inherit}
  a:focus-visible{outline:3px solid var(--salmon);outline-offset:3px;border-radius:14px}
  .w{max-width:440px;margin:0 auto;padding:0 16px 28px}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 14px}
  header img{height:24px;display:block}
  header span{font-size:12.5px;font-weight:600;color:var(--ink2)}
  .hero{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:22px;background:#222}
  h1{font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:18px 2px 16px}
  .cta{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:14px 20px;border-radius:18px;
       background:var(--act);color:#fff;text-decoration:none;font-weight:700;font-size:17px;
       box-shadow:0 8px 20px -8px rgba(80,30,10,.45);transition:transform .12s,background .12s}
  .cta:active{transform:scale(.98);background:var(--act-press)}
  .cta svg{width:20px;height:20px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px 10px;text-decoration:none;
        display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;transition:transform .12s}
  .tile:active{transform:scale(.97)}
  .tile svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .info{margin:18px 2px 0;font-size:13.5px;color:var(--ink2)}
  .info b{color:var(--ink);font-weight:700}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="w">
  <header>

      Сайт

    <a class="tile" href="https://wa.me/77477142222?text=%D0%97%D0%B4%D1%80%D0%B0%D0%B2%D1%81%D1%82%D0%B2%D1%83%D0%B9%D1%82%D0%B5!!%20%D0%A5%D0%BE%D1%87%D1%83%20%D1%81%D0%B4%D0%B5%D0%BB%D0%B0%D1%82%D1%8C%20%D0%B7%D0%B0%D0%BA%D0%B0%D0%B7">
      <svg viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c.3 2.3 2.2 4.3 4.5 4.8l1.2-1.2 2 .8"/></svg>
      WhatsApp
    </a>
    <a class="tile" href="tel:+77077142222">

</div>
