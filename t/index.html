<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Тест открытия приложения</title>
<link rel="stylesheet" href="../hub.css">
<style>.res{margin:16px 0;padding:14px;border-radius:14px;background:#fff;border:1px solid #E6DED6;font-weight:700}
.ua{font-size:11px;color:#6E6862;word-break:break-all;margin-top:18px}</style>
</head>
<body>
<div class="w">
  <h1>Тест: сразу в приложение</h1>
  <p class="note">Браузер: <b id="br"></b></p>
  <a class="btn main" id="go" href="#">Нажми сюда</a>
  <div class="res" id="res">Ждём нажатия</div>
  <p class="note">Если выскочит окно с ошибкой — запомни текст. Потом сделай скриншот этой страницы.</p>
  <div class="ua" id="ua"></div>
</div>
<script>
  var ua = navigator.userAgent || '';
  var br = /Instagram/i.test(ua) ? 'Instagram' : /FBAN|FBAV/i.test(ua) ? 'Facebook' :
           /WhatsApp/i.test(ua) ? 'WhatsApp' : /Telegram/i.test(ua) ? 'Telegram' :
           /CriOS/i.test(ua) ? 'Chrome' : /Safari/i.test(ua) ? 'Safari' : 'встроенный/другой';
  document.getElementById('br').textContent = br;
  document.getElementById('ua').textContent = ua;
  document.getElementById('go').addEventListener('click', function (e) {
    e.preventDefault();
    var res = document.getElementById('res'), ушли = false;
    function ушёл() { ушли = true; }
    document.addEventListener('visibilitychange', function () { if (document.hidden) ушёл(); });
    window.addEventListener('pagehide', ушёл);
    window.addEventListener('blur', ушёл);
    res.textContent = 'Пробую открыть…';
    setTimeout(function () {
      res.textContent = ушли ? '✅ Страница уходила — приложение открывалось'
                             : '❌ Остались на странице — приложение не открылось (тут ушли бы в App Store)';
    }, 1800);
    location.href = 'com.foodpicasso.lososkz://';
  });
</script>
</body>
</html>
